[package]
name = "bingwallpaper"
version = "2.4.0"
description = "Bing daily wallpaper for Windows, macOS and Linux"
authors = ["BingWallpaper Contributors"]
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
repository = "https://github.com/lzdbh/BingWallpaper2"
default-run = "bingwallpaper"

[lib]
name = "bingwallpaper_lib"
# 桌面端（Windows/macOS/Linux）只需 rlib；staticlib/cdylib 仅供 Tauri 移动端
# (iOS/Android) 使用，本项目不涉及移动端。此外 windows-gnu 工具链链接 cdylib
# 会触发 MinGW ld 的 `export ordinal too large` bug，故此处收敛为 rlib。
# 日后若要构建移动端，再加回 ["staticlib", "cdylib", "rlib"] 并在对应工具链上编译。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
env_logger = "0.11"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
